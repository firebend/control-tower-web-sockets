name: Merge on Main
on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    if: "!contains(github.event.head_commit.author.name, 'GitHub Action')"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 3

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org'
        package-manager-cache: false

    - run: echo "NX_HEAD=`git rev-parse HEAD`" >> $GITHUB_ENV
    - run: echo "NX_BASE=`git rev-parse HEAD~1`" >> $GITHUB_ENV
    - run: echo $NX_HEAD
    - run: echo $NX_BASE
    - run: npm ci
    - run: npx nx format:check --verbose
    - run: npx nx affected --target=lint
    - run: npx nx affected --target=test --ci --code-coverage
    - run: ./.github/scripts/pub.sh

    # - name: Build Docs
    #   if: env.flag
    #   run: npm run docs ./libs/web-socket-client/src/index.ts --tsconfig ./libs/web-socket-client/tsconfig.lib.json

    # No commit-back to main: branch protection requires a pull request, so
    # GITHUB_TOKEN cannot push there (GH006) and every release run failed on it.
    # pub.sh bumps from the registry, so the version in git no longer matters.
    # The tag from `npm version` is the only thing worth publishing back.
    - name: Push release tag
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --tags
  empty:
    runs-on: ubuntu-latest
    if: success()
    steps:
      - run: echo "Pipeline Succeeded"
